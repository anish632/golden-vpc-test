<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your State Rules - Volunteer Pathways Coalition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#faf8f4;color:#2a2520;line-height:1.7;font-size:18px}
.w{max-width:640px;margin:0 auto;padding:0 20px}
header{background:#1a3a2a;padding:40px 0 36px}
header h1{font-size:28px;font-weight:700;color:#fff;margin-bottom:10px}
header p{color:#c8d6cf;font-size:17px}
.lang{margin-top:12px}
.lang a{color:#a8c8b4;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer}
.bar{background:#fff;border-bottom:2px solid #d4d0cb;padding:20px 0;position:sticky;top:0;z-index:10}
.bi{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.bar label{font-weight:700;font-size:16px;color:#6b6560}
select{padding:14px 16px;border:2px solid #d4d0cb;border-radius:10px;font-family:inherit;font-size:17px;background:#fff;color:#2a2520;min-width:200px;max-width:300px}
select:focus{border-color:#3a7a52;outline:3px solid #e8f5e9}
.tabs{display:flex;gap:6px}
.tab{padding:14px 20px;border:2px solid transparent;border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;background:#eae7e2;color:#6b6560;min-height:48px}
.tab.on{background:#2d5f3f;color:#fff;border-color:#2d5f3f}
.tab:hover:not(.on){background:#d4d0cb}
main{padding:28px 0 80px}
.empty{text-align:center;padding:60px 20px;color:#9e9892;background:#f0ece4;border-radius:16px}
.empty h2{font-size:22px;color:#6b6560;margin-bottom:8px}
.ctx{font-size:16px;color:#6b6560;margin-bottom:24px;padding:16px 20px;background:#f0ece4;border-radius:12px}
.ctx b{color:#2a2520}
.urgent{background:#fef2f2;border:2px solid #b91c1c;border-radius:12px;padding:16px 20px;margin-bottom:20px}
.urgent b{color:#b91c1c}
.card{background:#fff;border:2px solid #d4d0cb;border-radius:16px;padding:28px;margin-bottom:16px}
.card h2{font-size:19px;font-weight:700;color:#2d5f3f;margin-bottom:14px}
.card p{font-size:17px;margin-bottom:10px}
.card ul{list-style:disc;padding-left:28px;margin:10px 0}
.card li{padding:4px 0;font-size:17px}
.opt{display:block;width:100%;padding:18px 24px;border:2px solid #d4d0cb;border-radius:12px;background:#fff;color:#2a2520;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:10px}
.opt:hover{border-color:#4a9a66;background:#f1f8e9}
.done{background:#e8f5e9;border:2px solid #4a9a66;border-radius:16px;padding:32px;text-align:center}
.done h2{font-size:22px;color:#2d5f3f;margin-bottom:8px}
.done p{font-size:17px;color:#4a4540}
.cta{display:inline-block;padding:18px 32px;background:#2d5f3f;border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;margin-top:12px}
.cta:hover{background:#3a7a52}
.cta2{display:inline-block;padding:14px 24px;background:#f1f8e9;border:2px solid #4a9a66;border-radius:10px;color:#2d5f3f;font-size:16px;font-weight:700;text-decoration:none;margin-top:8px}
.cta2:hover{background:#e8f5e9}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.back{display:inline-block;margin-bottom:20px;color:#2d5f3f;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;font-size:15px;padding:8px 0;text-decoration:underline}
.alert{background:#fef3c7;border:2px solid #92400e;border-radius:12px;padding:16px 20px;margin-top:14px}
.alert b{color:#92400e}
.note{background:#f1f8e9;border:2px solid #4a9a66;border-radius:12px;padding:16px 20px;margin-top:14px}
.help{margin-top:20px;padding:16px 20px;background:#fff;border:2px solid #d4d0cb;border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.help p{font-size:16px;margin:0;color:#4a4540;flex:1;min-width:200px}
.help a{padding:12px 20px;background:#fff;border:2px solid #4a9a66;border-radius:10px;color:#2d5f3f;font-size:15px;font-weight:700;text-decoration:none}
.help a:hover{background:#f1f8e9}
.src{margin-top:24px;padding:20px;background:#f0ece4;border-radius:12px}
.src h3{font-size:14px;font-weight:700;color:#6b6560;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
.src a{color:#2d5f3f;font-weight:600;font-size:15px;text-decoration:none;display:block;padding:4px 0}
.src a:hover{text-decoration:underline}
.src .dm{font-size:12px;color:#9e9892;margin-left:4px}
.disc{margin-top:12px;padding-top:12px;border-top:1px solid #d4d0cb;font-size:13px;color:#9e9892;text-align:center}
.disc a{color:#6b6560;font-weight:600}
.det{font-size:15px;color:#6b6560;margin-top:8px}
.fields{background:#f0ece4;border-radius:10px;padding:16px 20px;margin-top:14px}
.fields b{display:block;margin-bottom:6px}
.fields ol{margin:0;padding-left:24px}
.fields li{font-size:15px;padding:2px 0}
.gcta{background:#f1f8e9;border:2px solid #4a9a66;border-radius:16px;padding:28px;margin-bottom:16px}
.gcta h2{font-size:19px;font-weight:700;color:#2d5f3f;margin-bottom:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle;letter-spacing:.3px;text-transform:uppercase}
.badge.now{background:#fef2f2;color:#b91c1c;border:1px solid #f0a8a8}
.badge.soon{background:#fef3c7;color:#92400e;border:1px solid #e3c389}
.badge.snap{background:#eef2ff;color:#3730a3;border:1px solid #c0c7f2}
.share{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding:14px 18px;background:#fff;border:2px dashed #c4beb6;border-radius:12px}
.share p{font-size:14px;color:#6b6560;margin:0;flex:1;min-width:180px}
.share button{padding:11px 18px;border:2px solid #4a9a66;background:#f1f8e9;color:#2d5f3f;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.share button:hover{background:#e8f5e9}
.trk{background:#fff;border:2px solid #4a9a66;border-radius:14px;padding:22px;margin-top:18px}
.trk h3{font-size:17px;color:#2d5f3f;font-weight:700;margin-bottom:4px}
.trk .mo{font-size:13px;color:#6b6560;margin-bottom:14px}
.barwrap{background:#eae7e2;border-radius:999px;height:16px;overflow:hidden;margin:10px 0 6px}
.barfill{height:100%;background:#4a9a66;border-radius:999px;transition:width .3s;min-width:2px}
.barfill.full{background:#2d5f3f}
.trk .tot{font-size:15px;font-weight:700;color:#2a2520;margin-bottom:14px}
.trk .tot.met{color:#2d5f3f}
.tform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:12px}
.tform .fld{display:flex;flex-direction:column;gap:3px}
.tform label{font-size:12px;font-weight:700;color:#6b6560}
.tform input{padding:10px 12px;border:2px solid #d4d0cb;border-radius:9px;font-family:inherit;font-size:15px;background:#fff;color:#2a2520}
.tform input:focus{border-color:#3a7a52;outline:2px solid #e8f5e9}
.tform input.date{min-width:150px}.tform input.org{min-width:160px;flex:1}.tform input.hrs{width:84px}
.tadd{padding:11px 18px;border:none;background:#2d5f3f;color:#fff;border-radius:9px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tadd:hover{background:#3a7a52}
.tlist{list-style:none;padding:0;margin:14px 0 0}
.tlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eae7e2;font-size:14px}
.tlist .th{font-weight:700;color:#2d5f3f;min-width:54px}
.tlist .to{flex:1;color:#4a4540}.tlist .td{color:#9e9892;font-size:13px}
.tlist .del{background:none;border:none;color:#b91c1c;font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px}
.tempty{font-size:14px;color:#9e9892;margin-top:12px;font-style:italic}
.tnote{font-size:12px;color:#9e9892;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2520;color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media print{
  .bar,.tabs,.help,.share,.back,.tform,.cta,.cta2,.gcta,.toast{display:none!important}
  header{background:#1a3a2a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:13px}.card,.done,.ctx,.src{border-color:#ccc!important}
}
</style>
</head>

  return shareBar() + '<div class="src"><h3>Official state sources</h3>' + items + '<div class="disc">These rules may change. Check your state resources directly to confirm. <a href="mailto:info@volunteerpathwayscoalition.org?subject=H.R.%201%20State%20Rule%20Update">Work for a state agency? Submit an update.</a></div></div>';
}

function shareBar() {
  return '<div class="share"><p>Found this helpful? Send it to someone who needs it - the link opens to this same state.</p>' +
    '<button type="button" onclick="copyShare()">&#128279; Copy share link</button>' +
    '<button type="button" onclick="window.print()">&#128424; Print / save PDF</button></div>';
}

function bnSrc(d, nm) {
  return srcBox([
    [d.hp || nm + " rules", d.h],
    [d.p || "Benefits portal", d.pu],
    [d.pa || "Health agency", d.pau],
    [d.sa || "", d.sau || ""],
    [d.l || "211", d.lu]
  ]);
}

function npSrc(d, nm) {
  return srcBox([
    [d.hp || nm + " rules", d.h],
    [d.np || "State agency", d.npu || ""],
    [d.npa || "", d.npau || ""],
    [d.p || "Benefits portal", d.pu]
  ]);
}

function formLink(d) {
  if (!d.fn || !d.fu) return "";
  return '<div class="note"><p><b>Your state has an official form:</b> <a href="' + d.fu + '" target="_blank" rel="noopener noreferrer" style="color:#2d5f3f;font-weight:700">' + esc(d.fn) + '</a></p></div>';
}

function ctxBox(d, nm) {
  var t = "";
  if (d.ne) t = "<b>" + esc(nm) + "</b> did not expand Medicaid. SNAP food help rules (80 hours/month for adults 18-64) still apply.";
  else if (d.s.indexOf("Enforcing") >= 0) t = "<b>" + esc(nm) + "</b> is already enforcing work rules. Adults 19-64 on Medicaid must show 80 hours/month of work, school, or volunteering.";
  else if (d.s.indexOf("Soft") >= 0) t = "<b>" + esc(nm) + "</b> is tracking hours now but not removing coverage yet. Full rules start January 2027.";
  else t = "<b>" + esc(nm) + "</b> starts new Medicaid rules January 1, 2027. Adults 19-64 must show 80 hours/month of work, school, or volunteering.";
  return '<div class="ctx">' + statusBadge(d) + t + '</div>';
}

function statusBadge(d) {
  if (d.ne) return '<span class="badge snap">SNAP only</span>';
  if (d.s.indexOf("Enforcing") >= 0) return '<span class="badge now">In effect now</span>';
  if (d.s.indexOf("Soft") >= 0) return '<span class="badge soon">Tracking now</span>';
  return '<span class="badge soon">Starts Jan 2027</span>';
}

function urgentBox(d, nm) {
  if (d.s.indexOf("Enforcing") < 0 || d.ne) return "";
  return '<div class="urgent"><p><b>These rules are in effect now.</b> ' + esc(nm) + ' is already enforcing work rules. Do not wait - take action today to keep your coverage.</p></div>';
}

function setStep(n) { S = n; go(); }

function doBn(d, nm) {
  var out = document.getElementById("out");
  var lookback = (d.s.indexOf("Enforcing") >= 0 && !d.ne) ? "" : '<p class="det"><b>Important:</b> Most states check the 1 month before you apply or renew. If your state starts January 2027 and you apply that month, the state checks December 2026. Start volunteering now so you have hours to show.</p>';
  var screener = d.sc ? '<p class="det"><a href="' + d.sc + '" target="_blank" rel="noopener noreferrer" style="color:#2d5f3f;font-weight:600">Use your state screening tool to check if the rules apply to you &rarr;</a></p>' : "";

  if (S === 0) {
    out.innerHTML = urgentBox(d, nm) + ctxBox(d, nm) +
      '<div class="card"><h2>Do you already work or go to school?</h2>' +
      '<p>Do you work at least 80 hours a month, earn $580 or more, or go to school at least half time?</p>' +
      '<button class="opt" onclick="setStep(10)">Yes, I do</button>' +
      '<button class="opt" onclick="setStep(1)">No</button>' +
      '<button class="opt" onclick="setStep(1)" style="color:#9e9892">I am not sure</button>' +
      '</div>' + lookback + screener + helpBar(d) + bnSrc(d, nm);
    return;
  }

  if (S === 10) {
    out.innerHTML = '<button class="back" onclick="setStep(0)">&larr; Start over</button>' +
      '<div class="done"><h2>You are likely already covered.</h2>' +
      '<p>If you work enough hours or go to school, you already meet the rules.</p>' +
      '<p style="margin-top:14px;font-size:15px;color:#6b6560">Make sure your state has your latest information so nothing changes by mistake.</p>' +
      '<p class="det">You renew every 6 months now (not once a year). At each check, the state looks at just the month before - not all 6 months. Show 80 hours in that one month.</p>' +
      (d.pu ? '<a class="cta2" href="' + d.pu + '" target="_blank" rel="noopener noreferrer">Check your info on ' + esc(d.p || "your state site") + ' &rarr;</a>' : "") +
      '</div>' + helpBar(d) + bnSrc(d, nm);
    return;
  }

  if (S === 1) {
    out.innerHTML = '<button class="back" onclick="setStep(0)">&larr; Start over</button>' +
      urgentBox(d, nm) + ctxBox(d, nm) +
      '<div class="card"><h2>Are any of these true for you?</h2><ul>' +
      '<li>I am pregnant</li>' +
      '<li>I have a disability or serious health problem</li>' +
      '<li>I take care of a young child</li>' +
      '<li>I go to school at least half time</li>' +
      '<li>I am getting treatment for drugs or alcohol</li>' +
      '<li>I recently got out of jail or prison</li>' +
      '<li>I am 65 or older</li>' +
      '</ul>' +
      '<button class="opt" onclick="setStep(11)">Yes, one of these is true</button>' +
      '<button class="opt" onclick="setStep(2)">No, none of these apply</button>' +
      '<button class="opt" onclick="setStep(2)" style="color:#9e9892">I am not sure - show me my options</button>' +
      '</div>' + helpBar(d) + bnSrc(d, nm);
    return;
  }

  if (S === 11) {
    out.innerHTML = '<button class="back" onclick="setStep(0)">&larr; Start over</button>' +
      '<div class="done"><h2>You likely do not need to volunteer.</h2>' +
      '<p>People in your situation usually do not have to meet the work rules.</p>' +
      '<p style="margin-top:14px"><b>What to do:</b> Let your state know so they have the right info about you.</p>' +
      '<div class="row">' +
      (d.pu ? '<a class="cta2" href="' + d.pu + '" target="_blank" rel="noopener noreferrer">' + esc(d.p || "Your state site") + ' &rarr;</a>' : "") +
      (d.lu ? '<a class="cta2" href="' + d.lu + '" target="_blank" rel="noopener noreferrer">' + esc(d.l || "Call 211") + ' &rarr;</a>' : "") +
      '</div></div>' + helpBar(d) + bnSrc(d, nm);
    return;
  }

  if (S === 2) {
    var warn = "";
    if (d.na) warn = '<div class="alert"><p><b>In ' + esc(nm) + ':</b> You cannot just say you volunteered. The place where you volunteer must sign a paper proving your hours. Ask them before you start.</p></div>';

    out.innerHTML = '<button class="back" onclick="setStep(0)">&larr; Start over</button>' +
      urgentBox(d, nm) +
      '<div class="card"><h2>You may need to volunteer. We can help.</h2>' +
      '<p>You need <b>80 hours each month</b> - about 4 hours a day, 5 days a week. Volunteering at a food bank, library, shelter, clinic, or other nonprofit counts.</p>' +
      '<p>You can combine paid work, school, and volunteering to reach 80 hours. For example, 50 hours of work + 30 hours of volunteering.</p>' +
      '<p>It must be real community service at a qualifying organization. What does not count: political campaigning, informal help for a neighbor, or religious proselytizing as the primary activity.</p>' +
      '<p>Before you start, ask if they can sign a paper showing your hours. You will need this to prove what you did.</p>' +
      '<p class="det">You renew every 6 months now (not once a year). At each check, the state looks at just the month before - not all 6 months. Show 80 hours in that one month.</p>' +
      '<p class="det"><b>If you miss it:</b> you could lose your Medicaid coverage. Some states are giving extra time before removing benefits (hold-harmless period through June 2027). Check with your state.</p>' +
      lookback + warn + formLink(d) +
      '<p style="margin-top:20px;font-size:18px;font-weight:700;color:#2d5f3f">Find a volunteer spot and start tracking your hours:</p>' +
      '<a class="cta" href="https://portal.volunteerresources.org/" target="_blank" rel="noopener noreferrer">&rarr; Find where to volunteer</a>' +
      '</div>' + hoursTracker() + helpBar(d) + bnSrc(d, nm);
    return;
  }
}

// ---- Volunteer hours tracker (saved in this browser) ----
function monthKey() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0"); }
function monthLabel() { return new Date().toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }

function loadHours() {
  try { var r = localStorage.getItem("vpc_hours"); return r ? JSON.parse(r) : []; } catch (e) { return []; }
}
function saveHours(a) { try { localStorage.setItem("vpc_hours", JSON.stringify(a)); } catch (e) {} }

function addHours() {
  var dEl = document.getElementById("th_date"), oEl = document.getElementById("th_org"), hEl = document.getElementById("th_hrs");
  if (!dEl || !hEl) return;
  var h = parseFloat(hEl.value);
  if (!h || h <= 0) { toast("Enter how many hours"); hEl.focus(); return; }
  if (h > 24) h = 24;
  var all = loadHours();
  all.push({ mk: (dEl.value || todayStr()).slice(0, 7), d: dEl.value || todayStr(), o: (oEl.value || "").slice(0, 80), h: Math.round(h * 10) / 10 });
  saveHours(all);
  toast("Added " + (Math.round(h * 10) / 10) + " hours");
  go();
}
function delHours(i) {
  var cur = loadHours().filter(function (e) { return e.mk === monthKey(); });
  var tgt = cur[i];
  if (!tgt) return;
  var all = loadHours(); var removed = false;
  for (var j = 0; j < all.length; j++) {
    if (!removed && all[j].mk === tgt.mk && all[j].d === tgt.d && all[j].o === tgt.o && all[j].h === tgt.h) { all.splice(j, 1); removed = true; }
  }
  saveHours(all); go();
}

function hoursTracker() {
  var all = loadHours();
  var cur = all.filter(function (e) { return e.mk === monthKey(); });
  var total = 0;
  for (var i = 0; i < cur.length; i++) total += (cur[i].h || 0);
  total = Math.round(total * 10) / 10;
  var pct = Math.min(100, Math.round((total / 80) * 100));
  var met = total >= 80;
  var rows = "";
  if (cur.length === 0) {
    rows = '<p class="tempty">No hours logged yet this month. Add your first session above.</p>';
  } else {
    rows = '<ul class="tlist">';
    for (var k = 0; k < cur.length; k++) {
      rows += '<li><span class="th">' + cur[k].h + ' hr</span>' +
        '<span class="to">' + (esc(cur[k].o) || "Volunteering") + '</span>' +
        '<span class="td">' + esc(cur[k].d) + '</span>' +
        '<button class="del" onclick="delHours(' + k + ')" aria-label="Remove entry">Remove</button></li>';
    }
    rows += '</ul>';
  }
  return '<div class="trk"><h3>Track your volunteer hours</h3>' +
    '<p class="mo">' + esc(monthLabel()) + ' &middot; goal: 80 hours</p>' +
    '<div class="barwrap"><div class="barfill' + (met ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
    '<p class="tot' + (met ? ' met' : '') + '">' + total + ' of 80 hours' + (met ? ' &check; goal met this month' : ' (' + Math.max(0, Math.round((80 - total) * 10) / 10) + ' to go)') + '</p>' +
    '<div class="tform">' +
    '<div class="fld"><label for="th_date">Date</label><input class="date" type="date" id="th_date" value="' + todayStr() + '"></div>' +
    '<div class="fld org"><label for="th_org">Where (optional)</label><input class="org" type="text" id="th_org" placeholder="Food bank, library..."></div>' +
    '<div class="fld"><label for="th_hrs">Hours</label><input class="hrs" type="number" id="th_hrs" min="0" max="24" step="0.5" placeholder="4"></div>' +
    '<button class="tadd" onclick="addHours()">Add</button>' +
    '</div>' + rows +
    '<p class="tnote">Saved only on this device, just for you. Keep the signed proof from each organization - this tracker is for your own records.</p>' +
    '</div>';
}

function toast(msg) {
  var t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg; t.className = "toast show";
  clearTimeout(window.__tt);
  window.__tt = setTimeout(function () { t.className = "toast"; }, 2200);
}

// ---- Shareable URL + remembered state ----
function syncURL() {
  var nm = document.getElementById("pk").value;
  try {
    var p = new URLSearchParams();
    if (nm) { p.set("state", nm); p.set("for", T === "n" ? "nonprofit" : "benefits"); }
    var q = p.toString();
    history.replaceState(null, "", q ? "?" + q : location.pathname);
    if (nm) localStorage.setItem("vpc_last", nm + "|" + T);
  } catch (e) {}
}

function copyShare() {
  var url = location.href;
  function done() { toast("Link copied - share it to let others view this state"); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function () { prompt("Copy this link:", url); }); }
    else { prompt("Copy this link:", url); }
  } catch (e) { prompt("Copy this link:", url); }
}

function initApp() {
  var nm = "", forv = "";
  try {
    var p = new URLSearchParams(location.search);
    nm = p.get("state") || ""; forv = p.get("for") || "";
    if (!nm) { var last = localStorage.getItem("vpc_last"); if (last) { var parts = last.split("|"); nm = parts[0]; forv = parts[1] === "n" ? "nonprofit" : "benefits"; } }
  } catch (e) {}
  if (forv === "nonprofit" || forv === "n") T = "n";
  updTabs();
  if (nm && D[nm]) { document.getElementById("pk").value = nm; S = 0; go(); }
  else { go(); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
else initApp();

function doNp(d, nm) {
  var out = document.getElementById("out");
  var warn = "";
  if (d.na) warn = '<div class="alert"><p><b>In ' + esc(nm) + ':</b> Volunteers cannot self-report hours. Your organization must provide signed proof.</p></div>';

  var pnote = "";
  if (d.pn) pnote = '<div class="note"><p><b>' + esc(nm) + ':</b> ' + esc(d.pn) + '</p></div>';

  var regNote = "";
  if (d.reg) regNote = '<div class="alert"><p><b>Registration required in ' + esc(nm) + ':</b> Email <a href="mailto:' + d.reg + '" style="color:#92400e;font-weight:700">' + esc(d.reg) + '</a> to register your organization as a volunteer site.</p></div>';

  out.innerHTML = urgentBox(d, nm) + ctxBox(d, nm) +
    '<div class="card"><h2>What your organization needs to do</h2>' +
    '<p>Some people who volunteer with you may need proof of their hours to keep their health care or food help.</p>' +
    '<p><b>Your job is simple:</b> track their hours and sign a form when they ask. They send the form to the state - you do not have to.</p>' +
    '<p class="det"><b>Privacy rule:</b> Never collect Medicaid IDs, Social Security numbers, or medical details. Your only role is verifying attendance - not determining eligibility.</p>' +
    '<div class="fields"><b>The verification form must include:</b><ol>' +
    '<li>Your organization name</li>' +
    '<li>Address</li>' +
    '<li>Description of the volunteer activity</li>' +
    '<li>Dates of service</li>' +
    '<li>Total hours</li>' +
    '<li>Contact person name and phone number + signature</li>' +
    '</ol></div>' +
    warn + pnote +
    '<p class="det"><b>2028 rule:</b> Starting January 1, 2028, all states must request signed documentation when other data cannot verify hours. In 2027, some states accept self-attestation. Build your tracking process now.</p>' +
    regNote + formLink(d) +
    '</div>' +
    '<div class="gcta"><h2>Post volunteer opportunities for free</h2>' +
    '<p>List your opportunities on the Volunteer Pathways portal so people who need community service hours can find you.</p>' +
    '<a class="cta" href="https://portal.volunteerresources.org/" target="_blank" rel="noopener noreferrer" style="margin-top:8px">&rarr; Post opportunities for free</a>' +
    '<p style="margin-top:20px;font-size:15px;color:#6b6560">Need more tools to manage volunteers, track hours, and report to the state? <a href="https://goldenvolunteer.com/demo" target="_blank" rel="noopener noreferrer" style="color:#2d5f3f;font-weight:700">Schedule a demo with Golden &rarr;</a></p>' +
    '</div>' + npSrc(d, nm);
}
</script>
